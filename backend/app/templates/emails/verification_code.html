<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>ISAS — Email Verification</title>
</head>

<body style="
    margin: 0;
    padding: 0;
    background-color: #f4f6f8;
    font-family: Arial, Helvetica, sans-serif;
">

<div style="
    max-width: 520px;
    margin: 40px auto;
    padding: 0 20px;
">

    <div style="
        background-color: #ffffff;
        border-radius: 16px;
        padding: 40px;
        text-align: center;
    ">

        <h1 style="
            margin: 0 0 12px;
            color: #111827;
            font-size: 28px;
        ">
            Verify your email
        </h1>

        <p style="
            margin: 0 0 30px;
            color: #6b7280;
            font-size: 15px;
            line-height: 1.6;
        ">
            Thank you for registering at ISAS.<br>
            Enter the verification code below to confirm your email.
        </p>

        <div style="
            display: inline-block;
            padding: 16px 28px;
            background-color: #f3f4f6;
            border-radius: 12px;
            color: #111827;
            font-size: 32px;
            font-weight: bold;
            letter-spacing: 8px;
        ">
            {{ code }}
        </div>

        <p style="
            margin: 25px 0;
            color: #6b7280;
            font-size: 14px;
        ">
            This code is valid for <strong>10 minutes</strong>.
        </p>

        <div style="
            height: 1px;
            background-color: #e5e7eb;
            margin: 25px 0;
        "></div>

        <p style="
            margin: 0;
            color: #9ca3af;
            font-size: 12px;
        ">
            If you did not create an account at ISAS,
            you can safely ignore this email.
        </p>

    </div>

    <p style="
        text-align: center;
        margin-top: 20px;
        color: #9ca3af;
        font-size: 12px;
    ">
        © ISAS
    </p>

</div>

</body>
</html>
