{% extends 'base.html' %}

{% block content %}
<div class="min-h-screen px-6 py-12">
  <div class="mx-auto max-w-xl rounded-3xl bg-white p-8 shadow-sm">
    <h1 class="mb-4 text-2xl font-bold text-gray-900">
      Delete review?
    </h1>

    <p class="mb-6 text-gray-600">
      Are you sure you want to delete your review?
    </p>

    <form method="post">
      {% csrf_token %}
      <button type="submit"
              class="rounded-full bg-red-600 px-6 py-3 text-sm font-semibold text-white">
        Delete
      </button>

      <a href="{% url 'shop_detail' pk=review.shop.pk %}"
         class="ml-3 text-sm font-semibold text-gray-500 hover:text-blue-600">
        Cancel
      </a>
    </form>
  </div>
</div>
{% endblock %}
