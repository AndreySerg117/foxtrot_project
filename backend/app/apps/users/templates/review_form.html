{% extends 'base.html' %}

{% block content %}
<div class="min-h-screen px-6 py-12">
  <div class="mx-auto max-w-xl rounded-3xl bg-white p-8 shadow-sm">
    <h1 class="mb-6 text-2xl font-bold text-gray-900">
      Edit review
    </h1>

    <form method="post" class="space-y-4">
      {% csrf_token %}
      {{ form.rating }}
      {{ form.comment }}

      <button type="submit"
              class="rounded-full bg-blue-600 px-6 py-3 text-sm font-semibold text-white">
        Save changes
      </button>
    </form>
  </div>
</div>
{% endblock %}
