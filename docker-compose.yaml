services:
  nginx:
    image: nginx:alpine
    container_name: nginx_foxtrot
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/vol/static:ro
    depends_on:
      - backend
    networks:
      - main_network

  backend:
    container_name: backend_foxtrot
    hostname: backend_foxtrot
    build:
      dockerfile: Dockerfile
      context: ./backend
    restart: unless-stopped
    command:
      - sh
      - -c
      - >
        python manage.py migrate --noinput &&
        python manage.py collectstatic --noinput &&
        exec gunicorn core.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 60
    volumes:
      - static_data:/app/staticfiles
    depends_on:
      - db
    networks:
      - main_network
    env_file:
      - .env

  db:
    image: postgres:16
    container_name: foxtrot_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: foxtrot_db
      POSTGRES_USER: foxtrot_user
      POSTGRES_PASSWORD: foxtrot_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - main_network

networks:
  main_network:
    driver: bridge

volumes:
  postgres_data:
  static_data: