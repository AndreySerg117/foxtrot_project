services:
  nginx:
    image: nginx:alpine
    container_name: nginx_foxtrot
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/vol/static:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - main_network

  backend:
    container_name: backend_foxtrot
    hostname: backend_foxtrot
    build:
      dockerfile: Dockerfile
      context: ./backend
    restart: unless-stopped
    command:
      - gunicorn
      - core.wsgi:application
      - --bind
      - 0.0.0.0:8000
      - --workers
      - "3"
      - --timeout
      - "60"
    volumes:
      - static_data:/app/staticfiles
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - main_network
    env_file:
      - .env
    healthcheck:
      test: [ "CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=3)\"" ]
      interval: 20s
      timeout: 5s
      retries: 5

  db:
    image: postgres:16
    container_name: foxtrot_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: foxtrot_db
      POSTGRES_USER: foxtrot_user
      POSTGRES_PASSWORD: foxtrot_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - main_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis_foxtrot
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - main_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: worker_foxtrot
    restart: unless-stopped
    env_file:
      - .env
    command: celery -A core worker -l INFO
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - main_network

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: migrate_foxtrot
    restart: "no"
    env_file:
      - .env
    command:
      - sh
      - -c
      - >
        python manage.py migrate --noinput &&
        python manage.py collectstatic --noinput
    volumes:
      - static_data:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
    networks:
      - main_network

networks:
  main_network:
    driver: bridge

volumes:
  postgres_data:
  static_data:
  redis_data: